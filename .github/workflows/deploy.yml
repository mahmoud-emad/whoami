# Deploys to the production server after CI passes on the default branch.
#
# Runs scripts/deploy.sh, the same script used by hand: it ships the checked-out tree over SSH,
# rebuilds on the server, restarts the service and then polls the site. It never touches the
# server's data (config.json, db.json, uploads), so a deploy cannot overwrite posts.
#
# This is a public repository, so nothing about the server is written down here. Everything comes
# from repository secrets (Settings -> Secrets and variables -> Actions):
#
#   DEPLOY_HOST         user@host the script connects to
#   DEPLOY_SSH_KEY      private key of a key pair made only for deploys
#   DEPLOY_KNOWN_HOSTS  the server's host key line(s), so the connection is verified
#                       rather than trusted on first use. Get it with: ssh-keyscan -t ed25519 <host>
#   SITE_URL            https://your.domain, polled after the deploy
#
# Moving to another server later means changing these four values and nothing in this file.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy instead of cancelling it,
# because stopping a deploy halfway through the remote steps would leave the service down.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy a commit whose CI run succeeded. Manual runs skip that check by design.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever master has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # The script runs typecheck and lint before shipping anything.
      - run: yarn install --frozen-lockfile

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set as repository secrets." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'IdentityFile ~/.ssh/id_deploy\nIdentitiesOnly yes\nStrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: ./scripts/deploy.sh
