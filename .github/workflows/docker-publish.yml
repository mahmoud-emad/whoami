# Publishes the container images to the GitHub Container Registry.
#
# Runs on a push to the default branch (tagged `edge`), on a version tag (`v1.2.0` -> `1.2.0`
# plus `latest`), and on demand. No secrets to configure: GITHUB_TOKEN can write to ghcr.io for
# the repository that owns the workflow, which is what `packages: write` below grants.
name: Publish images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # The combined image keeps the plain repository name — it is the one to deploy.
          - name: whoami
            dockerfile: Dockerfile
            suffix: ''
          - name: whoami-backend
            dockerfile: Dockerfile.backend
            suffix: '-backend'
          - name: whoami-frontend
            dockerfile: Dockerfile.frontend
            suffix: '-frontend'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 covers Apple Silicon and the cheaper ARM cloud instances.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
