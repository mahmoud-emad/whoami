server {
    listen 80;
    server_name localhost;

    location /media/ {
        alias /home/mahmoud/myproject/media/;
        autoindex on;
    }

    location /static/ {
        alias /home/mahmoud/myproject/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;  # Django dev server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
